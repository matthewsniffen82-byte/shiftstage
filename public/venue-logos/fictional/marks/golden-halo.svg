      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(20 28)" filter="url(#softGlow)"><ellipse cx="160" cy="105" rx="106" ry="33" fill="none" stroke="url(#accent)" stroke-width="12"/><path d="M100 143v118m120-118v118M72 261h176" fill="none" stroke="url(#accent)" stroke-width="10" stroke-linecap="round"/></g>




