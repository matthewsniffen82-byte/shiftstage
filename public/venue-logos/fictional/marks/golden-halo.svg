<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="340" height="380" viewBox="0 20 340 380" role="img" aria-labelledby="title description">
  <title id="title">Golden Halo fictional venue logo</title>
  <desc id="description">Original MyDancr demonstration venue identity.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#facc15"/>
      <stop offset="1" stop-color="#f97316"/>
