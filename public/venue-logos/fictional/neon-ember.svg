<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title description">
  <title id="title">Neon Ember fictional venue logo</title>
  <desc id="description">Original MyDancr demonstration venue identity.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(20 28)" filter="url(#softGlow)"><path d="M160 54 181 147 268 116 201 180 277 227 181 208 160 307 139 208 43 227 119 180 52 116 139 147Z" fill="none" stroke="url(#accent)" stroke-width="10" stroke-linejoin="round"/></g>
  <text x="348" y="184" fill="#f8fafc" font-family="Arial Black, Helvetica Neue, Arial, sans-serif" font-size="68" font-weight="900" letter-spacing="-2">NEON EMBER</text>
  <rect x="350" y="217" width="470" height="3" rx="2" fill="url(#accent)"/>
  <text x="350" y="267" fill="#cbd5e1" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="8">MYDANCR DEMO VENUE</text>
  <text x="350" y="311" fill="url(#accent)" font-family="Arial Black, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="900" letter-spacing="9">NE · LAS VEGAS</text>
</svg>
