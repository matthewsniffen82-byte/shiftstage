<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title description">
  <title id="title">Afterglow Social fictional venue logo</title>
  <desc id="description">Original MyDancr demonstration venue identity.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(20 28)" filter="url(#softGlow)"><circle cx="160" cy="161" r="88" fill="none" stroke="url(#accent)" stroke-width="10"/><path d="M43 188h234M70 222h180M105 252h110" fill="none" stroke="url(#accent)" stroke-width="9" stroke-linecap="round"/></g>
  <text x="348" y="184" fill="#f8fafc" font-family="Arial Black, Helvetica Neue, Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="-2">AFTERGLOW SOCIAL</text>
  <rect x="350" y="217" width="470" height="3" rx="2" fill="url(#accent)"/>
  <text x="350" y="267" fill="#cbd5e1" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="8">MYDANCR DEMO VENUE</text>
  <text x="350" y="311" fill="url(#accent)" font-family="Arial Black, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="900" letter-spacing="9">AS · LAS VEGAS</text>
</svg>
